name: Daily AI News
on:
  schedule:
    - cron: '38 1 * * *'  # UTC 01:38 = 北京时间 09:38
  workflow_dispatch:  # 也可以在网页上手动点 Run workflow 立即跑一次

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate daily AI news
        run: |
          python scripts/fetch_ai_news.py
      - name: Commit and push
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add docs/ai-news/
          git commit -m "docs: daily AI news $(date +%Y-%m-%d)" || echo "no changes"
          git push
